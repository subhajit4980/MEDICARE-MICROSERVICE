spring:
  application:
    name: Auth-Service   # Name of this microservice (used by Eureka & Spring logs)

  data:
    mongodb:
      # MongoDB Atlas connection URI (username & password come from environment)
      uri: mongodb+srv://${mongoDB_username}:${mongoDB_Password}@medicare.qzyf5vd.mongodb.net/?retryWrites=true&w=majority
      database: Medicare   # Database name inside MongoDB

    redis:
      # Redis used for caching, sessions, token blacklisting, etc.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            # Google OAuth2 client credentials
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

            # Google redirects back to this URL after successful login
            redirect-uri: http://localhost:8085/login/oauth2/code/google

            # Basic user info access
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            # Google's OpenID issuer for token validation
            issuer-uri: https://accounts.google.com

  kafka:
    # Kafka broker location
    bootstrap-servers: localhost:9092

    producer:
      # Enables transactional Kafka producer
      transaction-id-prefix: tx-

      # Key and value serializers
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        enable.idempotence: true   # Prevents duplicate message delivery
        acks: all                  # Ensures full commit from all replicas

    consumer:
      # Key and value deserializers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"   # Allows deserialization from all packages
        transaction:
          id:
            prefix: tx-   # Enables transactional consumption support

cloud:
  openfeign:
    discovery:
      enabled: true   # Enables Feign client discovery via Eureka

server:
  address: 0.0.0.0   # Allows access from outside the local machine
  port: 8085        # Main port of the Auth Service

app:
  # JWT issuer — must match what you embed in generated tokens
  issuer: http://localhost:9000

  # JWT intended audience
  audience: medicare-api

  # Access token validity (in minutes)
  access-token-mins: 15

  # Refresh token validity (in days)
  refresh-token-days: 7

  jwks:
    # JWT signing key ID (used for key rotation)
    key-id: auth-key-2025

    rsa:
      # Base64-encoded RSA public key
      public-key-b64: ${PUBLIC_KEY}

      # Base64-encoded RSA private key
      private-key-b64: ${PRIVATE_KEY}

eureka:
  instance:
    prefer-ip-address: true      # Registers with IP instead of hostname
    hostname: ${HOST_AUTH:localhost}

  client:
    register-with-eureka: true  # Registers this service with Eureka
    fetch-registry: true        # Fetches list of all other services

    service-url:
      # Eureka server location
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  server:
    # Separate port for actuator endpoints
    port: ${MANAGEMENT_PORT:8081}

  endpoint:
    health:
      enabled: true                        # Enables /actuator/health
      show-details: when_authorized       # Shows details only when authorized
      group:
        custom:
          show-components: always         # Always show individual health components
          show-details: always            # Always show health details

  endpoints:
    web:
      exposure:
        # Exposes selected actuator endpoints over HTTP
        include: health,info,prometheus,metrics,env,health/readiness

springdoc:
  api-docs:
    # OpenAPI JSON endpoint
    path: /auth-service/v3/api-docs

  swagger-ui:
    # Swagger UI page
    path: /auth-service/swagger-ui.html
