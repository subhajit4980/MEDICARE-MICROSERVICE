spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            # existing routes...
            - id: AUTH-SERVICE-DOCS
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/docs/auth-service/**
              filters:
                - RewritePath=/docs/auth-service/(?<segment>.*), /${segment}

            - id: INVENTORY-SERVICE-DOCS
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/docs/inventory-service/**
              filters:
                - RewritePath=/docs/inventory-service/(?<segment>.*), /${segment}

            - id: NOTIFICATION-SERVICE-DOCS
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/docs/notification-service/**
              filters:
                - RewritePath=/docs/notification-service/(?<segment>.*), /${segment}

            - id: ORDER-SERVICE-DOCS
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/docs/order-service/**
              filters:
                - RewritePath=/docs/order-service/(?<segment>.*), /${segment}

            - id: PAYMENT-SERVICE-DOCS
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/docs/payment-service/**
              filters:
                - RewritePath=/docs/payment-service/(?<segment>.*), /${segment}

            - id: PRODUCT-SERVICE-DOCS
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/docs/product-service/**
              filters:
                - RewritePath=/docs/product-service/(?<segment>.*), /${segment}

            - id: USER-SERVICE-DOCS
              uri: lb://USER-SERVICE
              predicates:
                - Path=/docs/user-service/**
              filters:
                - RewritePath=/docs/user-service/(?<segment>.*), /${segment}
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${DOCKER_EUREKA_HOST:localhost}:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
  main:
    web-application-type: reactive

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway
      - url: /docs/auth-service/v3/api-docs
        name: Auth Service
      - url: /docs/inventory-service/v3/api-docs
        name: Inventory Service
      - url: /docs/notification-service/v3/api-docs
        name: Notification Service
      - url: /docs/order-service/v3/api-docs
        name: Order Service
      - url: /docs/payment-service/v3/api-docs
        name: Payment Service
      - url: /docs/product-service/v3/api-docs
        name: Product Service
      - url: /docs/user-service/v3/api-docs
        name: User Service
